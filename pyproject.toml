[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counselcopilot"
version = "0.1.0"
description = "CounselCopilot: checks NDA drafts against company policy and US law (LMA group project 2026)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dense = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
cc = "counselcopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
