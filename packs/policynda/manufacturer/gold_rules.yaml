# GOLD rule list for Keystone Precision Manufacturing, Inc., generated by claude-sonnet (agent) (packgen.py) and reviewed by people.
# Keep away from the reviewer builders: used only to score the policy compiler (design D17).
company: Keystone Precision Manufacturing, Inc.
description: Ohio industrial manufacturer of precision components. IP-heavy (designs, processes, tooling); works
  with suppliers, distribution partners and engineers; little personal data.
version: '1'
rules:
- id: P-01
  title: Oral disclosures covered
  requirement: The NDA must treat information disclosed orally or verbally, such as on the shop floor or in design
    reviews, as Confidential Information.
  kind: require
  term: Confidential Information may include verbally conveyed information.
  anchor:
    hypothesis: nda-3
  source:
    document: Trade Secret Protection Policy
    section: '3.1'
    quote: Our position is that knowledge conveyed aloud deserves the same protection as a drawing or a file, and
      any written nondisclosure agreement that Keystone signs must state that information communicated verbally
      counts as protected information just as written material does.
  keywords:
  - oral
  - orally
  - verbal
  - verbally conveyed
- id: P-02
  title: Use limited to the stated purpose
  requirement: The NDA must limit use of our information to the purposes stated in the agreement.
  kind: require
  term: The Receiving Party shall not use any Confidential Information for any purpose other than the purposes stated
    in the Agreement.
  severity: high
  anchor:
    hypothesis: nda-4
  source:
    document: Trade Secret Protection Policy
    section: '3.2'
    quote: Every nondisclosure agreement we sign must therefore restrict the recipient to using what it learns solely
      for the specific purposes described in that agreement, and for nothing else, including its own product development,
      quoting to other customers or training of its own staff.
  keywords:
  - purpose
  - use
  - limited use
- id: P-03
  title: No reverse engineering
  requirement: The NDA must forbid the counterparty from reverse engineering samples, tooling, prototypes or software
    that embody our confidential information.
  kind: require
  term: The Receiving Party shall not reverse engineer any objects which embody the Disclosing Party's Confidential
    Information.
  severity: high
  anchor:
    hypothesis: nda-11
  source:
    document: Trade Secret Protection Policy
    section: '3.4'
    quote: We require that any nondisclosure agreement forbid the recipient from analyzing our samples, prototypes,
      tooling or software in order to work out how they were made, including disassembly, decompilation, chemical
      or metallurgical analysis, and dimensional scanning intended to recreate them.
  keywords:
  - reverse engineer
  - decompile
  - disassemble
  - samples
  - prototypes
- id: P-04
  title: No licence or right granted
  requirement: The NDA must state that the counterparty receives no licence or other right in our designs, processes
    or other information.
  kind: require
  term: The Agreement shall not grant the Receiving Party any right to Confidential Information.
  anchor:
    hypothesis: nda-15
  source:
    document: Trade Secret Protection Policy
    section: '4.1'
    quote: Each nondisclosure agreement we sign must make clear that the other side acquires no license and no other
      right of any kind in our information, designs or processes by virtue of receiving them.
  keywords:
  - license
  - licence
  - no right
  - title
  - ownership
- id: P-05
  title: Obligations survive termination
  requirement: The NDA must say that confidentiality and related obligations continue after the agreement ends.
  kind: require
  term: Some obligations of the Agreement may survive termination of the Agreement.
  severity: high
  anchor:
    hypothesis: nda-19
  refs:
  - P-07
  - P-20
  source:
    document: Trade Secret Protection Policy
    section: '5.1'
    quote: For that reason each nondisclosure agreement must state that the recipient's duties of secrecy and the
      other terms that are meant to continue do not fall away when the agreement is terminated or expires, but remain
      in force afterward.
  keywords:
  - survive
  - survival
  - termination
  - expiry
- id: P-06
  title: Minimum confidentiality term
  requirement: Confidentiality obligations in every NDA must last at least 60 months.
  kind: field
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 60
  refs:
  - P-19
  source:
    document: Trade Secret Protection Policy
    section: '5.3'
    quote: Every nondisclosure agreement Keystone signs must therefore keep the recipient's secrecy duties running
      for a period of not less than 60 months.
  keywords:
  - term
  - duration
  - confidentiality period
- id: P-07
  title: Minimum survival period
  requirement: Confidentiality obligations must survive termination of the NDA for at least 36 months.
  kind: field
  constraint:
    field: survival_months
    op: '>='
    value: 36
  refs:
  - P-20
  source:
    document: Trade Secret Protection Policy
    section: '5.4'
    quote: Where the agreement ends before the secrecy period would otherwise run out, the recipient's duties must
      continue after termination for at least 36 months.
  keywords:
  - survival
  - post-termination
  - tail
- id: P-08
  title: Supplier return or destruction of materials
  requirement: Supplier NDAs must oblige the supplier to return or destroy our confidential information when the
    agreement ends.
  kind: require
  term: The Receiving Party shall destroy or return some Confidential Information upon the termination of the Agreement.
  applies_if: counterparty == 'vendor'
  severity: high
  anchor:
    hypothesis: nda-16
  refs:
  - P-09
  - P-24
  source:
    document: Supplier Engagement Policy
    section: '3.1'
    quote: Every nondisclosure agreement with a supplier must oblige the supplier to give back or destroy the information
      we have provided once the agreement is over.
  keywords:
  - return
  - destroy
  - destruction
  - termination
  - supplier
- id: P-09
  title: Maximum return deadline
  requirement: The counterparty must return or destroy our materials within 30 days of termination or written request,
    unless the Vice President, Supply Chain approves a longer period.
  kind: field
  constraint:
    field: return_deadline_days
    op: <=
    value: 30
  approval: Vice President, Supply Chain
  refs:
  - P-08
  - P-24
  source:
    document: Supplier Engagement Policy
    section: '3.2'
    quote: The return or destruction has to be completed within 30 days of the end of the agreement or of our written
      request, whichever comes first.
  keywords:
  - return deadline
  - days
  - destruction deadline
- id: P-10
  title: No non-solicitation in supplier and customer NDAs
  requirement: NDAs with suppliers and customers must not bind either side not to solicit the other's personnel,
    and no NDA governed by California law may contain such a restriction.
  kind: forbid
  term: The Receiving Party shall not solicit some of the Disclosing Party's representatives.
  applies_if: counterparty in ['vendor', 'customer'] or governing_law == 'california'
  anchor:
    hypothesis: nda-18
  source:
    document: Supplier Engagement Policy
    section: '3.4'
    quote: For that reason, a nondisclosure agreement with a supplier or a customer must not contain a clause that
      bars either side from approaching or hiring the other's personnel, and no agreement governed by California
      law, whoever the counterparty is, may contain that kind of employee-restricting clause.
  keywords:
  - solicit
  - hire
  - employees
  - personnel
  - non-solicitation
- id: P-11
  title: No retained copies after return for mid and high value suppliers
  requirement: For medium and high value deals, the NDA must not let the counterparty keep any of our information
    after it has returned or destroyed the rest, unless the Chief Technology Officer approves.
  kind: forbid
  term: The Receiving Party may retain some Confidential Information even after the return or destruction of Confidential
    Information.
  applies_if: value_band in ['medium', 'high']
  severity: high
  anchor:
    hypothesis: nda-20
  approval: Chief Technology Officer
  refs:
  - P-08
  source:
    document: Supplier Engagement Policy
    section: '3.6'
    quote: On deals that fall in the medium or high value band, a supplier must not be allowed to keep any of our
      information once it has returned or destroyed the rest.
  keywords:
  - retain
  - retention
  - residual
  - archival copy
  - residuals
- id: P-12
  title: Notice before compelled disclosure
  requirement: The NDA must oblige the counterparty to tell us when a law, regulation or court process requires
    it to disclose our information.
  kind: require
  term: The Receiving Party shall notify the Disclosing Party if it is required by law, regulation or judicial process
    to disclose any Confidential Information.
  anchor:
    hypothesis: nda-8
  source:
    document: Partner and Distributor Policy
    section: '3.2'
    quote: Every nondisclosure agreement with a partner, and with any other organization, must therefore require
      the recipient to inform Keystone when a statute, regulation or legal process compels it to disclose our information.
  keywords:
  - compelled disclosure
  - subpoena
  - court order
  - required by law
  - notify
- id: P-13
  title: Definition not limited to technical information
  requirement: Partner and customer NDAs must not confine confidential information to technical information, because
    pricing, customer and channel data also need protection.
  kind: forbid
  term: Confidential Information shall only include technical information.
  applies_if: counterparty in ['partner', 'customer']
  severity: high
  anchor:
    hypothesis: nda-2
  refs:
  - P-01
  source:
    document: Partner and Distributor Policy
    section: '3.4'
    quote: A nondisclosure agreement with a partner or a customer therefore must not define protected information
      so narrowly that it covers only technical matter.
  keywords:
  - technical information
  - business information
  - definition
  - pricing
- id: P-14
  title: Existence of the partnership kept confidential
  requirement: Partner and distributor NDAs must keep confidential the fact that the agreement was made or negotiated.
  kind: require
  term: The Receiving Party shall not disclose the fact that the Agreement was agreed or negotiated.
  applies_if: counterparty == 'partner'
  severity: low
  anchor:
    hypothesis: nda-10
  source:
    document: Partner and Distributor Policy
    section: '4.1'
    quote: The nondisclosure agreement with a partner must require the partner not to disclose that the agreement
      was concluded or that the parties negotiated it, except as Keystone has agreed in writing.
  keywords:
  - existence of agreement
  - negotiations
  - announcement
  - publicity
- id: P-15
  title: No independent-development carve-out for strategic partners
  requirement: In high value partner NDAs, the NDA must not let the partner independently develop information similar
    to ours.
  kind: forbid
  term: The Receiving Party may independently develop information similar to Confidential Information.
  applies_if: counterparty == 'partner' and value_band == 'high'
  severity: high
  anchor:
    hypothesis: nda-12
  refs:
  - P-17
  source:
    document: Partner and Distributor Policy
    section: '4.3'
    quote: Where the relationship is in the high deal value band, typically a joint development or a long-term manufacturing
      arrangement, the nondisclosure agreement must not contain wording that lets the partner independently create
      information resembling what we disclose.
  keywords:
  - independent development
  - similar information
  - joint development
  - co-development
- id: P-16
  title: Sharing with advisers and contractors
  requirement: The NDA must let the receiving party pass information to its outside advisers, consultants and agents
    under confidentiality duties.
  kind: require
  term: The Receiving Party may share some Confidential Information with some third-parties, including consultants,
    agents and professional advisors.
  anchor:
    hypothesis: nda-7
  source:
    document: Legal Review and Approval Policy
    section: '3.1'
    quote: An agreement that governs the exchange of our information must allow the recipient to pass what it receives
      to its outside advisers, consultants and agents, provided they are bound to keep it secret.
  keywords:
  - third parties
  - consultants
  - agents
  - professional advisors
  - outside counsel
- id: P-17
  title: Information obtained from third parties
  requirement: The NDA must let the receiving party acquire information similar to ours from a third party without
    breaching the agreement.
  kind: require
  term: The Receiving Party may acquire information similar to Confidential Information from a third party.
  severity: low
  anchor:
    hypothesis: nda-13
  source:
    document: Legal Review and Approval Policy
    section: '3.3'
    quote: Each agreement should therefore confirm that the recipient remains free to obtain information resembling
      ours from a third party.
  keywords:
  - third party source
  - lawfully received
  - similar information
  - exclusions
- id: P-18
  title: No penalty or liquidated damages
  requirement: The NDA must not impose a fixed penalty or liquidated damages sum on breach of confidentiality.
  kind: forbid
  term: The agreement imposes a fixed penalty or liquidated damages payable on breach of confidentiality.
  source:
    document: Legal Review and Approval Policy
    section: '4.2'
    quote: Keystone does not sign an agreement that fixes a penalty or liquidated damages amount to be paid when
      a party breaches its duty of secrecy, and it does not ask the other side to accept one.
  keywords:
  - penalty
  - liquidated damages
  - fixed sum
  - breach
- id: P-19
  title: Maximum confidentiality term
  requirement: Confidentiality obligations may not run longer than 120 months unless the General Counsel approves
    a longer or indefinite term.
  kind: field
  constraint:
    field: confidentiality_term_months
    op: <=
    value: 120
  approval: General Counsel
  refs:
  - P-06
  source:
    document: Legal Review and Approval Policy
    section: '5.1'
    quote: The period during which a recipient must keep our information secret, and during which we must keep theirs
      secret, may not exceed 120 months.
  keywords:
  - term
  - maximum duration
  - indefinite
- id: P-20
  title: Maximum survival period
  requirement: Obligations that survive termination of an NDA may not extend beyond 84 months.
  kind: field
  severity: low
  constraint:
    field: survival_months
    op: <=
    value: 84
  refs:
  - P-07
  source:
    document: Legal Review and Approval Policy
    section: '5.2'
    quote: Duties that are expressed to continue after an agreement has been terminated must not extend past 84
      months from termination.
  keywords:
  - survival
  - post-termination
  - tail
- id: P-21
  title: Governing law
  requirement: NDAs must be governed by Ohio or Delaware law unless the General Counsel approves another governing
    law.
  kind: field
  severity: high
  constraint:
    field: governing_law
    op: in
    value:
    - ohio
    - delaware
  approval: General Counsel
  source:
    document: Legal Review and Approval Policy
    section: '6.1'
    quote: Documents that Keystone signs must be governed by the law of Ohio or the law of Delaware.
  keywords:
  - governing law
  - choice of law
  - Ohio
  - Delaware
- id: P-22
  title: Working copies permitted
  requirement: The NDA must allow the receiving party to make copies of our information where its engineers need
    them to do the work.
  kind: require
  term: The Receiving Party may create a copy of some Confidential Information in some circumstances.
  severity: low
  anchor:
    hypothesis: nda-17
  refs:
  - P-08
  source:
    document: Engineering Data Handling Policy
    section: '3.2'
    quote: Any agreement under which we supply information to an outside party must therefore allow the recipient
      to make copies of portions of what we provide where that is needed for the task, subject to the other protections
      in the agreement.
  keywords:
  - copies
  - reproduce
  - backup
  - working copy
- id: P-23
  title: Protection not conditional on marking
  requirement: When we are the disclosing party, the NDA must not make protection depend on every disclosure being
    marked or identified as confidential.
  kind: forbid
  term: All Confidential Information shall be expressly identified by the Disclosing Party.
  applies_if: company_side == 'disclosing'
  severity: high
  anchor:
    hypothesis: nda-1
  source:
    document: Engineering Data Handling Policy
    section: '3.5'
    quote: Where Keystone is the disclosing side, the agreement we sign must protect our information whether or
      not it carries a legend, and must not make protection depend on whether each item was marked or identified
      as secret.
  keywords:
  - marking
  - marked confidential
  - identified
  - legend
- id: P-24
  title: Minimum return window
  requirement: The return or destruction period must be at least 10 days, so that engineering archives and backups
    can be located and processed.
  kind: field
  severity: low
  constraint:
    field: return_deadline_days
    op: '>='
    value: 10
  refs:
  - P-09
  source:
    document: Engineering Data Handling Policy
    section: '4.2'
    quote: The time allowed to the other side for returning or destroying our materials must be at least 10 days,
      so that the recipient can find and process all of it.
  keywords:
  - return deadline
  - minimum period
  - archive
- id: P-25
  title: Personal data safeguards
  requirement: Where personal data will be exchanged, the NDA must require the recipient to use it only for the
    stated purpose and to protect it with appropriate security measures.
  kind: require
  term: The Receiving Party shall process personal data only for the stated purpose and protect it with appropriate
    security measures.
  applies_if: personal_data
  severity: high
  source:
    document: Engineering Data Handling Policy
    section: '5.1'
    quote: When personal data is to be exchanged with an outside party, the agreement must require the recipient
      to use the personal data solely for the purpose stated and to protect it with appropriate security safeguards.
  keywords:
  - personal data
  - security measures
  - processing
  - privacy
- id: P-26
  title: Longer confidentiality term for personal data
  requirement: When personal data is shared, confidentiality must last at least 84 months.
  kind: field
  applies_if: personal_data
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 84
  refs:
  - P-25
  - P-19
  source:
    document: Engineering Data Handling Policy
    section: '5.2'
    quote: If personal data is going to be shared, the period during which the recipient must keep information secret
      must run for at least 84 months.
  keywords:
  - personal data
  - term
  - duration
- id: P-27
  title: Export control compliance
  requirement: Where the counterparty is outside the United States or the NDA is governed by non-US law, the NDA
    must require compliance with export control laws and bar re-export of our technical data without authorization.
  kind: require
  term: The Receiving Party shall comply with applicable export control laws and shall not export or re-export technical
    data without authorization.
  applies_if: foreign or not us_law
  severity: high
  source:
    document: Engineering Data Handling Policy
    section: '5.4'
    quote: When the recipient of our information is located outside the United States, or when the governing law
      of the agreement is not that of a US state, the agreement must contain an undertaking by the recipient to
      comply with applicable export control laws and not to export or re-export our technical data without the required
      authorization.
  keywords:
  - export control
  - EAR
  - ITAR
  - re-export
  - technical data
- id: P-28
  title: Sharing with the recipient's employees
  requirement: The NDA must let the receiving party share our information with those of its own employees who need
    it.
  kind: require
  term: The Receiving Party may share some Confidential Information with some of the Receiving Party's employees.
  anchor:
    hypothesis: nda-5
  source:
    document: Employee Confidentiality Policy
    section: '3.1'
    quote: Whenever Keystone signs an agreement that governs how the other side treats our information, the agreement
      must permit the recipient to share some of that information with those of its own employees who need it for
      the purpose of the work.
  keywords:
  - employees
  - need to know
  - personnel
  - sharing
- id: P-29
  title: Employee non-solicitation of colleagues
  requirement: Employee and contractor-engineer agreements must bind the individual not to solicit our personnel,
    except where California law governs.
  kind: require
  term: The Receiving Party shall not solicit some of the Disclosing Party's representatives.
  applies_if: counterparty == 'employee' and governing_law != 'california'
  anchor:
    hypothesis: nda-18
  refs:
  - P-10
  source:
    document: Employee Confidentiality Policy
    section: '3.3'
    quote: For that reason, each agreement with an individual employee or contractor engineer must commit the individual
      not to solicit Keystone's personnel to leave.
  keywords:
  - solicit
  - colleagues
  - personnel
  - employees
  - non-solicitation
- id: P-30
  title: Trade secret whistleblower immunity notice
  requirement: Employee agreements governed by US law must include the notice of immunity for confidential disclosure
    of trade secrets to government officials or an attorney.
  kind: require
  term: The agreement includes notice of the immunity for confidential disclosure of trade secrets to government
    officials or an attorney in reporting a suspected violation of law.
  applies_if: counterparty == 'employee' and us_law
  severity: high
  source:
    document: Employee Confidentiality Policy
    section: '4.2'
    quote: Keystone therefore requires that each agreement with an employee that is governed by United States law,
      whether federal or state, include a notice of this immunity.
  keywords:
  - whistleblower
  - DTSA
  - immunity notice
  - trade secrets
  - 1833(b)
