# GOLD rule list for Bayview Health Partners, generated by claude-sonnet (agent) (packgen.py) and reviewed by people.
# Keep away from the reviewer builders: used only to score the policy compiler (design D17).
company: Bayview Health Partners
description: California non-profit hospital group. Patient data (PHI) is involved in most deals; HIPAA and CCPA
  apply; many vendors (IT, billing, research partners) and clinical staff.
version: '1'
rules:
- id: P-01
  title: Oral disclosures covered
  requirement: The NDA must protect information shared orally, such as in clinical case discussions and phone calls.
  kind: require
  term: Confidential Information may include verbally conveyed information.
  anchor:
    hypothesis: nda-3
  source:
    document: Confidentiality Agreement Policy
    section: '3.1'
    quote: Every agreement must expressly extend its protection to information that is conveyed verbally, including
      remarks made during case conferences, committee meetings, site visits and telephone calls.
  keywords:
  - oral
  - verbal
  - orally
- id: P-02
  title: Notice of compelled disclosure
  requirement: The counterparty must tell us before it discloses our information because a law, regulation or court
    process requires it.
  kind: require
  term: The Receiving Party shall notify the Disclosing Party if it is required by law, regulation or judicial process
    to disclose any Confidential Information.
  severity: high
  anchor:
    hypothesis: nda-8
  source:
    document: Confidentiality Agreement Policy
    section: '3.2'
    quote: If a counterparty is compelled by a statute, regulation, subpoena or other legal process to disclose
      our information, the agreement must require it to give Bayview advance notice of that demand.
  keywords:
  - subpoena
  - court order
  - required by law
  - notify
- id: P-03
  title: Use limited to the stated purpose
  requirement: Our information may be used only for the purpose the agreement states.
  kind: require
  term: The Receiving Party shall not use any Confidential Information for any purpose other than the purposes stated
    in the agreement.
  severity: high
  anchor:
    hypothesis: nda-4
  source:
    document: Confidentiality Agreement Policy
    section: '3.3'
    quote: Each agreement must restrict the recipient to using our information solely for the specific purpose that
      the agreement describes.
  keywords:
  - purpose
  - use
- id: P-04
  title: Definition not limited to technical information
  requirement: For vendor and partner NDAs, confidential information must not be defined as technical information
    only, because most of what we share is clinical, financial or operational.
  kind: forbid
  term: Confidential Information shall only include technical information.
  applies_if: counterparty in ['vendor', 'partner']
  anchor:
    hypothesis: nda-2
  source:
    document: Confidentiality Agreement Policy
    section: '4.1'
    quote: In agreements with vendors and partners, the definition of protected information may not be confined
      to technical material, since most of what Bayview shares is clinical, financial or operational.
  keywords:
  - technical
  - definition
- id: P-05
  title: No marking requirement where personal data is shared
  requirement: When personal data is shared, protection must not depend on the information being marked or expressly
    identified as confidential.
  kind: forbid
  term: All Confidential Information shall be expressly identified by the Disclosing Party.
  applies_if: personal_data
  severity: high
  anchor:
    hypothesis: nda-1
  source:
    document: Confidentiality Agreement Policy
    section: '4.2'
    quote: Whenever personal data will be exchanged, the agreement may not make protection conditional on the information
      being labelled, stamped or otherwise identified as confidential in advance.
  keywords:
  - marked
  - identified
  - labelled
- id: P-06
  title: Return or destruction when the agreement ends
  requirement: The NDA must oblige the counterparty to return or destroy our information when the agreement ends.
  kind: require
  term: The Receiving Party shall destroy or return some Confidential Information upon the termination of the agreement.
  severity: high
  anchor:
    hypothesis: nda-16
  refs:
  - P-22
  source:
    document: Confidentiality Agreement Policy
    section: '5.1'
    quote: On termination or expiry, the agreement must oblige the recipient either to return or to destroy the
      information it received from Bayview.
  keywords:
  - return
  - destroy
  - termination
- id: P-07
  title: Minimum confidentiality term
  requirement: Confidentiality obligations must last at least 36 months. A shorter term needs approval from the
    Chief Compliance Officer.
  kind: field
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 36
  approval: Chief Compliance Officer
  refs:
  - P-08
  source:
    document: Confidentiality Agreement Policy
    section: '6.1'
    quote: Protection obligations must remain in force for a minimum of 36 months, and the Chief Compliance Officer
      is the only person who may approve a shorter term.
- id: P-08
  title: Maximum confidentiality term
  requirement: Confidentiality obligations must not be set for longer than 120 months.
  kind: field
  severity: low
  constraint:
    field: confidentiality_term_months
    op: <=
    value: 120
  refs:
  - P-07
  source:
    document: Confidentiality Agreement Policy
    section: '6.2'
    quote: No agreement may set the protection period at more than 120 months.
- id: P-09
  title: No non-solicitation of staff in vendor NDAs
  requirement: Vendor NDAs must not restrict us from soliciting or hiring the vendor's staff, because we recruit
    clinical and IT staff from staffing vendors.
  kind: forbid
  term: The Receiving Party shall not solicit some of the Disclosing Party's representatives.
  applies_if: counterparty == 'vendor'
  anchor:
    hypothesis: nda-18
  source:
    document: Business Associate and Vendor Policy
    section: '3.1'
    quote: A vendor agreement may not contain a clause that bars Bayview from approaching or hiring the vendor's
      personnel, because we routinely recruit clinical and information technology staff from staffing vendors.
  keywords:
  - solicit
  - hire
  - staff
  - recruit
- id: P-10
  title: No reverse engineering by vendors
  requirement: Vendor NDAs must prohibit reverse engineering of the systems, software and devices we share.
  kind: require
  term: The Receiving Party shall not reverse engineer any objects which embody the Disclosing Party's Confidential
    Information.
  applies_if: counterparty == 'vendor'
  anchor:
    hypothesis: nda-11
  source:
    document: Business Associate and Vendor Policy
    section: '3.2'
    quote: Each vendor agreement must forbid the vendor from reverse engineering, decompiling or disassembling any
      system, software or device that Bayview makes available.
  keywords:
  - reverse engineer
  - decompile
  - disassemble
- id: P-11
  title: Return or destruction of personal data
  requirement: When personal data is shared, the NDA must oblige the recipient to return or destroy that data when
    the agreement ends.
  kind: require
  term: The Receiving Party shall destroy or return some Confidential Information upon the termination of the agreement.
  applies_if: personal_data
  severity: high
  anchor:
    hypothesis: nda-16
  refs:
  - P-06
  source:
    document: Business Associate and Vendor Policy
    section: '4.1'
    quote: Where an agreement involves personal data, the vendor must be bound to return or destroy that data at
      the end of the relationship.
  keywords:
  - PHI
  - return
  - destroy
  - business associate
- id: P-12
  title: Maximum return deadline
  requirement: Information must be returned or destroyed within 30 days of our request or the end of the agreement.
  kind: field
  constraint:
    field: return_deadline_days
    op: <=
    value: 30
  refs:
  - P-13
  source:
    document: Business Associate and Vendor Policy
    section: '4.2'
    quote: Return or destruction must be completed within 30 days after Bayview asks for it or the agreement ends.
- id: P-13
  title: Minimum return deadline when we receive
  requirement: When we are the receiving party, the deadline to return or destroy information must be at least 10
    days, so records holds can be checked.
  kind: field
  applies_if: company_side == 'receiving'
  severity: low
  constraint:
    field: return_deadline_days
    op: '>='
    value: 10
  refs:
  - P-12
  source:
    document: Business Associate and Vendor Policy
    section: '4.3'
    quote: When Bayview is on the receiving side, the agreement must give Bayview at least 10 days to complete return
      or destruction so that litigation and records holds can be checked first.
- id: P-14
  title: No offshore handling of personal data
  requirement: When personal data is shared, the NDA must not let the recipient store, access or process it outside
    the United States, unless the Chief Information Security Officer approves.
  kind: forbid
  term: The Receiving Party may store, access or process Confidential Information outside the United States.
  applies_if: personal_data
  severity: high
  approval: Chief Information Security Officer
  refs:
  - P-15
  source:
    document: Business Associate and Vendor Policy
    section: '5.1'
    quote: Where personal data is involved, the agreement may not permit the recipient to store, access or process
      that data outside the United States, unless the Chief Information Security Officer has approved the arrangement.
  keywords:
  - offshore
  - outside the United States
  - cross-border
- id: P-15
  title: Security incident notification
  requirement: The NDA must oblige the recipient to tell us promptly about any unauthorized use or disclosure of
    our information.
  kind: require
  term: The Receiving Party shall promptly notify the Disclosing Party of any unauthorized use or disclosure of
    Confidential Information.
  severity: high
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '3.1'
    quote: Every agreement must require the recipient to inform Bayview without delay of any use or disclosure of
      our information that was not authorized.
  keywords:
  - breach
  - incident
  - unauthorized
  - notify
- id: P-16
  title: No retained residuals where personal data is shared
  requirement: When personal data is shared, the recipient must not be allowed to keep any of it after returning
    or destroying the rest.
  kind: forbid
  term: The Receiving Party may retain some Confidential Information even after the return or destruction of Confidential
    Information.
  applies_if: personal_data
  severity: high
  anchor:
    hypothesis: nda-20
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '3.2'
    quote: Where personal data is shared, the agreement may not allow the recipient to hold back any portion of
      it once the rest has been returned or destroyed.
  keywords:
  - retain
  - residual
  - archival copy
- id: P-17
  title: No copying of personal data
  requirement: When personal data is shared, the NDA must not allow the recipient to make copies of it.
  kind: forbid
  term: The Receiving Party may create a copy of some Confidential Information in some circumstances.
  applies_if: personal_data
  anchor:
    hypothesis: nda-17
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '3.3'
    quote: Where personal data is shared, the agreement may not let the recipient make duplicates or reproductions
      of that data.
  keywords:
  - copy
  - reproduce
  - duplicate
- id: P-18
  title: Safeguards for our information
  requirement: The NDA must oblige the recipient to protect our information with administrative, physical and technical
    safeguards.
  kind: require
  term: The Receiving Party shall protect Confidential Information with reasonable administrative, physical and
    technical safeguards.
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '3.4'
    quote: The recipient must be obliged to protect our information using administrative, physical and technical
      safeguards.
  keywords:
  - safeguards
  - security
  - protect
- id: P-19
  title: Minimum survival for personal data
  requirement: When personal data is shared, confidentiality obligations must survive termination for at least 72
    months. A shorter period needs approval from the Chief Privacy Officer.
  kind: field
  applies_if: personal_data
  severity: high
  constraint:
    field: survival_months
    op: '>='
    value: 72
  approval: Chief Privacy Officer
  refs:
  - P-23
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '4.1'
    quote: When personal data is shared, protection must continue after termination for at least 72 months, and
      only the Chief Privacy Officer may approve a shorter period.
- id: P-20
  title: Sharing with our workforce
  requirement: The NDA must allow us to share the information with our own employees, physicians and other workforce
    members who need it.
  kind: require
  term: The Receiving Party may share some Confidential Information with some of its employees.
  anchor:
    hypothesis: nda-5
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '5.1'
    quote: The agreement must allow Bayview to pass the information to its own employees, physicians and other workforce
      members who need it to do their jobs.
  keywords:
  - employees
  - workforce
  - need to know
- id: P-21
  title: Sharing with advisors, auditors and accreditors
  requirement: The NDA must allow us to share the information with consultants, auditors, accreditors, outside counsel
    and other professional advisors.
  kind: require
  term: The Receiving Party may share some Confidential Information with some third parties, including consultants,
    agents and professional advisors.
  anchor:
    hypothesis: nda-7
  source:
    document: Privacy and HIPAA Compliance Policy
    section: '5.2'
    quote: The agreement must also allow Bayview to disclose the information to consultants, auditors, accreditation
      bodies, outside counsel and other professional advisors.
  keywords:
  - advisors
  - auditors
  - accreditors
  - counsel
  - third parties
- id: P-22
  title: Survival of obligations
  requirement: The NDA must state that confidentiality obligations continue after the agreement ends.
  kind: require
  term: Some obligations of the agreement may survive termination of the agreement.
  severity: high
  anchor:
    hypothesis: nda-19
  refs:
  - P-06
  source:
    document: Medical Records Retention Policy
    section: '3.1'
    quote: Every agreement must say that the recipient's confidentiality obligations carry on after the agreement
      itself has ended.
  keywords:
  - survive
  - survival
  - termination
- id: P-23
  title: Maximum survival period
  requirement: Surviving obligations must not run longer than 180 months.
  kind: field
  severity: low
  constraint:
    field: survival_months
    op: <=
    value: 180
  refs:
  - P-19
  source:
    document: Medical Records Retention Policy
    section: '3.2'
    quote: Those continuing obligations may not extend beyond 180 months.
- id: P-24
  title: Governing law
  requirement: The NDA must be governed by California or Delaware law unless the General Counsel approves otherwise.
  kind: field
  severity: high
  constraint:
    field: governing_law
    op: in
    value:
    - california
    - delaware
  approval: General Counsel
  source:
    document: Delegation of Authority and Signature Policy
    section: '4.1'
    quote: Agreements must be governed by the law of California or Delaware, and the General Counsel alone may approve
      any other governing law.
- id: P-25
  title: No penalty clauses
  requirement: The NDA must not impose liquidated damages or a monetary penalty on a party for breach.
  kind: forbid
  term: The Receiving Party shall pay liquidated damages or a contractual penalty for breach of the agreement.
  source:
    document: Delegation of Authority and Signature Policy
    section: '4.2'
    quote: An agreement may not impose liquidated damages or any other monetary penalty on a party simply for breaching
      it.
  keywords:
  - liquidated damages
  - penalty
- id: P-26
  title: No non-compete under California law
  requirement: When the NDA is governed by California law, it must not restrict a party from competing or from practising
    a profession or business.
  kind: forbid
  term: The agreement restricts a party from competing with the other party or from engaging in a lawful profession
    or business.
  applies_if: governing_law == 'california'
  severity: high
  source:
    document: Delegation of Authority and Signature Policy
    section: '4.3'
    quote: If an agreement is governed by California law, it may not restrict either party from competing or from
      engaging in a lawful profession or business.
  keywords:
  - non-compete
  - restraint
  - competing
- id: P-27
  title: Right to acquire similar information when we receive
  requirement: When we are the receiving party, the NDA must preserve our right to obtain similar information from
    a third party.
  kind: require
  term: The Receiving Party may acquire information similar to Confidential Information from a third party.
  applies_if: company_side == 'receiving'
  anchor:
    hypothesis: nda-13
  source:
    document: Research Collaboration Policy
    section: '3.1'
    quote: When Bayview is the receiving party, the agreement must preserve Bayview's freedom to obtain similar
      information lawfully from a third party.
  keywords:
  - third party
  - similar information
  - lawfully obtained
- id: P-28
  title: Independent development preserved
  requirement: The NDA must preserve our right to independently develop information similar to what is disclosed,
    which protects our own research programs.
  kind: require
  term: The Receiving Party may independently develop information similar to Confidential Information.
  anchor:
    hypothesis: nda-12
  source:
    document: Research Collaboration Policy
    section: '3.2'
    quote: Every research agreement must preserve Bayview's right to develop similar information independently,
      so that our own investigators are not blocked from their programs.
  keywords:
  - independent development
  - similar information
- id: P-29
  title: No licence granted
  requirement: The NDA must state that it grants the recipient no right or licence to the information.
  kind: require
  term: The agreement shall not grant the Receiving Party any right to Confidential Information.
  anchor:
    hypothesis: nda-15
  source:
    document: Research Collaboration Policy
    section: '3.3'
    quote: The agreement must confirm that the recipient receives no license or other right in the information we
      share.
  keywords:
  - license
  - licence
  - no rights
- id: P-30
  title: Existence of the collaboration kept confidential
  requirement: The NDA must stop the recipient from disclosing that the agreement exists or was negotiated.
  kind: require
  term: The Receiving Party shall not disclose the fact that the agreement was agreed or negotiated.
  severity: low
  anchor:
    hypothesis: nda-10
  source:
    document: Research Collaboration Policy
    section: '3.4'
    quote: The agreement must prohibit the recipient from disclosing that the collaboration exists or that the agreement
      was negotiated.
  keywords:
  - existence
  - announcement
  - publicity
