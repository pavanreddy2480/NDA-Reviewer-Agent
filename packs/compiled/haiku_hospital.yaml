# Requirement cards for Bayview Health Partners, compiled by claude-haiku-agent from the prose policies
# (policy/compiler.py). 34 cards from 11 documents; 0 dropped for a quote not in the policy.
company: Bayview Health Partners
description: ''
version: compiled-1
rules:
- id: C-01
  title: No restriction on hiring vendor personnel
  requirement: The NDA must not contain a clause that bars the company from approaching or hiring the other side's
    personnel.
  kind: forbid
  term: The NDA must not contain a clause that bars the company from approaching or hiring the other side's personnel.
  applies_if: counterparty == 'vendor'
  applies_when: vendor agreements
  severity: medium
  refs: []
  source:
    document: Business Associate and Vendor Policy
    section: '3.1'
    quote: A vendor agreement may not contain a clause that bars Bayview from approaching or hiring the vendor's
      personnel, because we routinely recruit clinical and information technology staff from staffing vendors.
  keywords:
  - hiring restriction
  - non-solicit vendor staff
  - no-hire clause
- id: C-02
  title: Vendor must not reverse engineer our systems
  requirement: The NDA must forbid the vendor from reverse engineering, decompiling or disassembling any system,
    software or device the company makes available.
  kind: require
  term: The NDA must forbid the vendor from reverse engineering, decompiling or disassembling any system, software
    or device the company makes available.
  applies_if: counterparty == 'vendor'
  applies_when: vendor agreements
  severity: medium
  refs: []
  source:
    document: Business Associate and Vendor Policy
    section: '3.2'
    quote: Each vendor agreement must forbid the vendor from reverse engineering, decompiling or disassembling any
      system, software or device that Bayview makes available.
  keywords:
  - no reverse engineering
  - no decompiling
  - no disassembly
- id: C-03
  title: Return or destruction of personal data at end of relationship
  requirement: The NDA must bind the vendor to return or destroy personal data at the end of the relationship.
  kind: require
  term: The NDA must bind the vendor to return or destroy personal data at the end of the relationship.
  applies_if: counterparty == 'vendor' and personal_data
  applies_when: agreements with vendors that involve personal data
  severity: medium
  refs: []
  source:
    document: Business Associate and Vendor Policy
    section: '4.1'
    quote: Where an agreement involves personal data, the vendor must be bound to return or destroy that data at
      the end of the relationship.
  keywords:
  - return or destroy data
  - data return
  - destruction on termination
- id: C-04
  title: Return deadline when the company discloses
  requirement: Return or destruction of the company's information must be completed within the 30-day limit after
    our request or the end of the agreement.
  kind: field
  term: Return or destruction of the company's information must be completed within the 30-day limit after our request
    or the end of the agreement.
  applies_if: counterparty == 'vendor'
  applies_when: vendor agreements
  severity: medium
  constraint:
    field: return_deadline_days
    op: <=
    value: 30
  approval: Privacy Office
  refs: []
  source:
    document: Business Associate and Vendor Policy
    section: '4.2'
    quote: Return or destruction must be completed within 30 days after Bayview asks for it or the agreement ends.
  keywords:
  - return deadline
  - destruction deadline
  - days to return
- id: C-05
  title: Minimum return time when the company receives information
  requirement: When the company is the receiving party, the NDA must give it at least the 10-day minimum to complete
    return or destruction.
  kind: field
  term: When the company is the receiving party, the NDA must give it at least the 10-day minimum to complete return
    or destruction.
  applies_if: company_side == 'receiving'
  applies_when: agreements where Bayview is the receiving party
  severity: medium
  constraint:
    field: return_deadline_days
    op: '>='
    value: 10
  refs: []
  source:
    document: Business Associate and Vendor Policy
    section: '4.3'
    quote: When Bayview is on the receiving side, the agreement must give Bayview at least 10 days to complete return
      or destruction so that litigation and records holds can be checked first.
  keywords:
  - return period
  - destruction period
  - time to return
- id: C-06
  title: No offshore handling of personal data
  requirement: The NDA must not permit the recipient to store, access or process personal data outside the United
    States.
  kind: forbid
  term: The NDA must not permit the recipient to store, access or process personal data outside the United States.
  applies_if: personal_data
  applies_when: agreements where personal data is involved
  severity: medium
  approval: Chief Information Security Officer
  refs: []
  source:
    document: Business Associate and Vendor Policy
    section: '5.1'
    quote: Where personal data is involved, the agreement may not permit the recipient to store, access or process
      that data outside the United States, unless the Chief Information Security Officer has approved the arrangement.
  keywords:
  - data location
  - offshore processing
  - data outside United States
- id: C-07
  title: Verbal disclosures covered
  requirement: The NDA must expressly extend its protection to information conveyed verbally.
  kind: require
  term: The NDA must expressly extend its protection to information conveyed verbally.
  applies_if: 'True'
  applies_when: ''
  severity: high
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '3.1'
    quote: Every agreement must expressly extend its protection to information that is conveyed verbally, including
      remarks made during case conferences, committee meetings, site visits and telephone calls.
  keywords:
  - verbal disclosure
  - oral information
  - conversations protected
- id: C-08
  title: Advance notice of compelled disclosure
  requirement: The NDA must require the receiving party to give the disclosing party advance notice of any legally
    compelled disclosure of its information.
  kind: require
  term: The NDA must require the receiving party to give the disclosing party advance notice of any legally compelled
    disclosure of its information.
  applies_if: 'True'
  applies_when: a counterparty is compelled by a statute, regulation, subpoena or other legal process to disclose
    Bayview information
  severity: high
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '3.2'
    quote: If a counterparty is compelled by a statute, regulation, subpoena or other legal process to disclose
      our information, the agreement must require it to give Bayview advance notice of that demand.
  keywords:
  - compelled disclosure notice
  - subpoena notice
  - legal process notice
- id: C-09
  title: Use limited to stated purpose
  requirement: The NDA must restrict the recipient to using the disclosing party's information solely for the specific
    purpose the agreement describes.
  kind: require
  term: The NDA must restrict the recipient to using the disclosing party's information solely for the specific
    purpose the agreement describes.
  applies_if: 'True'
  applies_when: ''
  severity: high
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '3.3'
    quote: Each agreement must restrict the recipient to using our information solely for the specific purpose that
      the agreement describes.
  keywords:
  - purpose limitation
  - use restriction
  - permitted purpose
- id: C-10
  title: Definition not limited to technical material
  requirement: The NDA confines the definition of protected information to technical material such as source code,
    schematics and specifications.
  kind: forbid
  term: The NDA confines the definition of protected information to technical material such as source code, schematics
    and specifications.
  applies_if: counterparty == 'vendor' or counterparty == 'partner'
  applies_when: agreements with vendors and partners
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '4.1'
    quote: In agreements with vendors and partners, the definition of protected information may not be confined
      to technical material, since most of what Bayview shares is clinical, financial or operational.
  keywords:
  - confidential information definition
  - technical material only
  - source code definition
- id: C-11
  title: No marking condition where personal data is shared
  requirement: The NDA makes protection of information conditional on it being labelled, stamped or otherwise identified
    as confidential in advance.
  kind: forbid
  term: The NDA makes protection of information conditional on it being labelled, stamped or otherwise identified
    as confidential in advance.
  applies_if: personal_data
  applies_when: personal data will be exchanged
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '4.2'
    quote: Whenever personal data will be exchanged, the agreement may not make protection conditional on the information
      being labelled, stamped or otherwise identified as confidential in advance.
  keywords:
  - marking requirement
  - labelled as confidential
  - marked confidential
- id: C-12
  title: Bayview not obliged to mark information
  requirement: The NDA obliges the disclosing party to mark information as confidential as a condition of its protection.
  kind: forbid
  term: The NDA obliges the disclosing party to mark information as confidential as a condition of its protection.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '4.2'
    quote: Business sponsors should not agree to a clause that obliges Bayview to mark information as a condition
      of protection.
  keywords:
  - mark as condition
  - marking obligation
  - stamp confidential
- id: C-13
  title: Exclusions must not swallow the definition
  requirement: The NDA excludes from Confidential Information anything that could be found in published literature,
    even where the recipient's use of it is novel.
  kind: forbid
  term: The NDA excludes from Confidential Information anything that could be found in published literature, even
    where the recipient's use of it is novel.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '4.3'
    quote: Analysts raise a question only if an exclusion is so wide that it could swallow the definition, for example
      one that excludes anything that "could be found in published literature" even where Bayview's use of it is
      novel.
  keywords:
  - exclusions published literature
  - public domain exclusion
  - carve-out scope
- id: C-14
  title: Return or destruction on termination
  requirement: The NDA must oblige the recipient, on termination or expiry, to return or destroy the information
    it received from the disclosing party.
  kind: require
  term: The NDA must oblige the recipient, on termination or expiry, to return or destroy the information it received
    from the disclosing party.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '5.1'
    quote: On termination or expiry, the agreement must oblige the recipient either to return or to destroy the
      information it received from Bayview.
  keywords:
  - return or destroy
  - termination return
  - destruction obligation
- id: C-15
  title: Bayview legally required records carved out
  requirement: The NDA must exempt the Bayview party's legally required records and its copies of the signed agreement
    and correspondence from any return or destruction obligation.
  kind: require
  term: The NDA must exempt the Bayview party's legally required records and its copies of the signed agreement
    and correspondence from any return or destruction obligation.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality Agreement Policy
    section: '5.3'
    quote: A letter of confirmation from a counterparty never obliges Bayview to destroy records that the law requires
      it to keep, and a counterparty's destruction obligation does not extend to Bayview's own copies of the signed
      agreement or its correspondence.
  keywords:
  - records retention carve-out
  - legally required records
  - destruction exemption
