  source:
    document: Data Protection and Privacy Policy
    section: '3.1'
    quote: Where personal data will be exchanged, protection may not depend on the disclosing party marking or labelling
      the information as confidential.
  keywords:
  - marked confidential
  - labelling
  - personal data protection
- id: C-18
  title: Minimum confidentiality term for personal data
  requirement: When personal data is involved, the NDA's duty of confidence must last at least the required minimum
    term.
  kind: field
  term: When personal data is involved, the NDA's duty of confidence must last at least the required minimum term.
  applies_if: personal_data
  applies_when: personal data is involved in the exchange
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 36
  refs: []
