  - personal data survival
- id: C-19
  title: Standard contractual clauses for cross-border personal data
  requirement: The agreement must incorporate the EU Standard Contractual Clauses or another transfer mechanism
    approved by the Privacy Office.
  kind: require
  term: The agreement must incorporate the EU Standard Contractual Clauses or another transfer mechanism approved
    by the Privacy Office.
  applies_if: foreign and personal_data
  applies_when: personal data is transferred to or from a counterparty outside the United States
  severity: high
  refs: []
