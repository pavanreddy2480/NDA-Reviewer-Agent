      Office.
  keywords:
  - standard contractual clauses
  - international transfer
  - transfer mechanism
- id: C-20
  title: Vendor flow-down and breach support
  requirement: The agreement must require the vendor to flow the same data protection obligations down to its sub-processors
    and to support Northwind in meeting data subject requests and breach duties.
  kind: require
  term: The agreement must require the vendor to flow the same data protection obligations down to its sub-processors
    and to support Northwind in meeting data subject requests and breach duties.
  applies_if: counterparty == 'vendor' and personal_data
  applies_when: vendors that process personal data for Northwind
  severity: medium
  refs: []
  source:
    document: Data Protection and Privacy Policy
    section: '12'
    quote: Vendors that process personal data for Northwind must pass the security and privacy review described
      in the Vendor and Third-Party Risk Policy, sign a data processing addendum reflecting this Policy, flow the
      same obligations down to their own sub-processors and support Northwind in meeting data subject requests and
      breach duties.
  keywords:
  - sub-processor flow-down
  - data processing addendum
  - vendor obligations
