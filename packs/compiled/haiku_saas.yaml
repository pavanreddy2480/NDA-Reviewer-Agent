    quote: Class-action waivers are not used in business-to-business agreements.
  keywords:
  - class action waiver
  - class action
  - collective action waiver
- id: C-17
  title: Personal data protection must not depend on marking
  requirement: The NDA must not make protection of personal data depend on the disclosing party marking the information
    as confidential.
  kind: forbid
  term: The NDA must not make protection of personal data depend on the disclosing party marking the information
    as confidential.
