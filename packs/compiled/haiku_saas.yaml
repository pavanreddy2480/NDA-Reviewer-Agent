company: Northwind Cloud, Inc.
description: ''
version: compiled-1
rules:
- id: C-01
  title: Use limited to stated purpose
  requirement: The NDA must limit the receiving party's use of our information to the purposes the agreement states,
    and no other purpose.
  kind: require
  term: The NDA must limit the receiving party's use of our information to the purposes the agreement states, and
    no other purpose.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '4.1'
    quote: Every agreement we sign or propose must limit the receiving party's use of our information to the purposes
      the agreement itself states, and no other purpose.
  keywords:
  - permitted purpose
  - use restriction
  - purpose limitation
- id: C-02
  title: Oral disclosures covered
  requirement: The NDA must cover information disclosed orally in meetings, calls or demonstrations, not only written
    material.
  kind: require
  term: The NDA must cover information disclosed orally in meetings, calls or demonstrations, not only written material.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '4.2'
    quote: Information that we share in meetings, calls or demonstrations must be covered even though it is spoken
      and never written down.
  keywords:
  - oral disclosure
  - verbal information
  - meetings and demonstrations
- id: C-03
  title: Confidentiality continues after the agreement ends
  requirement: The NDA must state that the duties of confidence continue to bind the parties after the agreement
    has ended or expired.
  kind: require
  term: The NDA must state that the duties of confidence continue to bind the parties after the agreement has ended
    or expired.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '4.3'
    quote: The agreement must make clear that the duties of confidence continue to bind the parties after the agreement
      has ended or expired.
  keywords:
  - survive termination
  - duties continue
  - survival clause
- id: C-04
  title: Notice before compelled disclosure
  requirement: The NDA must require the other side to tell us before it discloses our information because law, regulation
    or a court or agency process compels it.
  kind: require
  term: The NDA must require the other side to tell us before it discloses our information because law, regulation
    or a court or agency process compels it.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '4.4'
    quote: If the other side is compelled by law, regulation or a court or agency process to disclose our information,
      it must tell us before it does so.
  keywords:
  - compelled disclosure
  - legally required disclosure
  - court order notice
- id: C-05
  title: No grant of rights in disclosed information
  requirement: The NDA must not grant the other side a license, ownership interest or any other right in the information
    we disclose.
  kind: forbid
  term: The NDA must not grant the other side a license, ownership interest or any other right in the information
    we disclose.
  applies_if: 'True'
  applies_when: ''
  severity: high
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '4.5'
    quote: No clause may be read as handing the other side a licence, ownership interest or any other right in the
      information we disclose.
  keywords:
  - no license granted
  - ownership of information
  - no rights granted
- id: C-06
  title: Protected information covers business information for customers and partners
  requirement: In customer and partner agreements, the definition of protected information must include business,
    financial and commercial information, not only technical material.
  kind: require
  term: In customer and partner agreements, the definition of protected information must include business, financial
    and commercial information, not only technical material.
  applies_if: counterparty in ('customer', 'partner')
  applies_when: agreements with customers and partners
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '5.1'
    quote: In agreements with customers and partners, the definition of protected information must reach business,
      financial and commercial information and may not be confined to technical material alone.
  keywords:
  - definition of confidential information
  - business information
  - commercial information
- id: C-07
  title: No hiring or approach restriction in customer agreements
  requirement: The NDA must not bar either side from approaching or hiring the other side's people.
  kind: forbid
  term: The NDA must not bar either side from approaching or hiring the other side's people.
  applies_if: counterparty == 'customer'
  applies_when: agreements with customers
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '5.2'
    quote: An agreement with a customer must not bar either side from approaching or hiring the other side's people.
  keywords:
  - non-solicit employees
  - no-hire clause
  - hiring restriction
- id: C-08
  title: Relationship kept confidential
  requirement: The NDA must stop the other side from revealing that the parties have negotiated or entered into
    the agreement.
  kind: require
  term: The NDA must stop the other side from revealing that the parties have negotiated or entered into the agreement.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '5.3'
    quote: The other side must agree not to reveal that the parties have negotiated or entered into the agreement.
  keywords:
  - existence of agreement confidential
  - disclose relationship
  - negotiations confidential
- id: C-09
  title: No residuals clause
  requirement: The NDA must not let the other side keep using information it remembers from our information (a residuals
    clause).
  kind: forbid
  term: The NDA must not let the other side keep using information it remembers from our information (a residuals
    clause).
  applies_if: 'True'
  applies_when: ''
  severity: high
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '5.4'
    quote: We never accept a clause that lets the other side keep using whatever it happens to remember from our
      information, often called a residuals clause.
  keywords:
  - residuals clause
  - retained knowledge
  - use of memory
- id: C-10
  title: Minimum duration of confidentiality
  requirement: The duty of confidence in the NDA must run for at least the 24-month minimum.
  kind: field
  term: The duty of confidence in the NDA must run for at least the 24-month minimum.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 24
  approval: Deputy General Counsel
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '6.1'
    quote: The duty of confidence must run for at least 24 months.
  keywords:
  - confidentiality term
  - duration of confidentiality
  - confidentiality period
- id: C-11
  title: Maximum duration of confidentiality
  requirement: The duty of confidence in the NDA must not be stated to run for longer than the 60-month maximum.
  kind: field
  term: The duty of confidence in the NDA must not be stated to run for longer than the 60-month maximum.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  constraint:
    field: confidentiality_term_months
    op: <=
    value: 60
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '6.2'
    quote: The duty of confidence may not be stated to run for more than 60 months.
  keywords:
  - confidentiality term
  - duration of confidentiality
  - confidentiality period
- id: C-12
  title: Minimum survival of obligations
  requirement: Obligations that survive the end of the NDA must survive for at least the 24-month minimum.
  kind: field
  term: Obligations that survive the end of the NDA must survive for at least the 24-month minimum.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  constraint:
    field: survival_months
    op: '>='
    value: 24
  approval: General Counsel
  refs: []
  source:
    document: Confidentiality and NDA Standard
    section: '6.3'
    quote: Obligations that survive the end of the agreement must survive for at least 24 months.
  keywords:
  - survival period
  - obligations survive termination
  - surviving obligations
- id: C-13
  title: Governing law
  requirement: The NDA must be governed by Delaware or New York law unless the General Counsel approves another
    governing law in writing.
  kind: field
  term: The NDA must be governed by Delaware or New York law unless the General Counsel approves another governing
    law in writing.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  constraint:
    field: governing_law
    op: in
    value:
    - delaware
    - new york
  approval: General Counsel
  refs: []
  source:
    document: Contract Approval Matrix
    section: '3.1'
    quote: Agreements must be governed by the law of Delaware or New York, and any other governing law requires
      prior written approval from the General Counsel.
  keywords:
  - governing law
  - choice of law
  - governed by the laws of
- id: C-14
  title: Non-solicitation of staff in partner agreements
  requirement: Any restriction in the NDA on soliciting the other side's staff must last no longer than the 12-month
    limit.
  kind: field
  term: Any restriction in the NDA on soliciting the other side's staff must last no longer than the 12-month limit.
  applies_if: counterparty == 'partner'
  applies_when: partner agreements that restrict soliciting the other side's staff
  severity: medium
  constraint:
    field: non_solicit_months
    op: <=
    value: 12
  approval: Chief Revenue Officer
  refs: []
  source:
    document: Contract Approval Matrix
    section: '4.1'
    quote: In partner agreements, any restriction on soliciting the other side's staff may last no longer than 12
      months, and a longer restriction requires approval from the Chief Revenue Officer.
  keywords:
  - non-solicit staff
  - no-hire
  - employee solicitation
  - soliciting employees
- id: C-15
  title: No restraint on competing where California law governs
  requirement: The NDA must not contain a clause that restricts the other party from competing or from working in
    its profession or trade.
  kind: forbid
  term: The NDA must not contain a clause that restricts the other party from competing or from working in its profession
    or trade.
  applies_if: governing_law == 'california'
  applies_when: agreements governed by California law
  severity: high
  refs: []
  source:
    document: Contract Approval Matrix
    section: '4.2'
    quote: Where California law governs, the agreement must not contain any clause that restricts the other party
      from competing or from working in its profession or trade.
  keywords:
  - non-compete
  - restraint of trade
  - non-competition clause
  - limit profession
- id: C-16
  title: No class-action waiver in business-to-business agreements
  requirement: The NDA must not contain a class-action waiver.
  kind: forbid
  term: The NDA must not contain a class-action waiver.
  applies_if: counterparty in ('vendor', 'customer', 'partner')
  applies_when: business-to-business agreements
  severity: medium
  refs: []
