- id: C-29
  title: Notice of compelled disclosure
  requirement: The NDA must require the recipient to inform Keystone when a statute, regulation or legal process
    compels it to disclose Keystone information.
  kind: require
  term: The NDA must require the recipient to inform Keystone when a statute, regulation or legal process compels
    it to disclose Keystone information.
  applies_if: 'True'
  applies_when: every nondisclosure agreement with a partner or any other organization
  severity: high
  refs: []
  source:
    document: Partner and Distributor Policy
    section: '3.2'
    quote: Every nondisclosure agreement with a partner, and with any other organization, must therefore require
      the recipient to inform Keystone when a statute, regulation or legal process compels it to disclose our information.
  keywords:
  - compelled disclosure notice
  - legal process notice
  - subpoena notification
- id: C-30
  title: Protected information must not be limited to technical matter
  requirement: The NDA must not define protected information so narrowly that it covers only technical matter and
    leaves out business and commercial information.
  kind: forbid
  term: The NDA must not define protected information so narrowly that it covers only technical matter and leaves
    out business and commercial information.
  applies_if: counterparty in ['partner', 'customer']
  applies_when: nondisclosure agreements with partners or customers
  severity: medium
  refs: []
  source:
    document: Partner and Distributor Policy
    section: '3.4'
    quote: A nondisclosure agreement with a partner or a customer therefore must not define protected information
      so narrowly that it covers only technical matter.
  keywords:
  - definition of confidential information
  - commercial information
  - technical information only
- id: C-31
  title: No disclosure of the partner relationship
  requirement: The NDA with a partner must require the partner not to disclose that the agreement was concluded
    or that the parties negotiated it, except as Keystone has agreed in writing.
  kind: require
  term: The NDA with a partner must require the partner not to disclose that the agreement was concluded or that
    the parties negotiated it, except as Keystone has agreed in writing.
  applies_if: counterparty == 'partner'
  applies_when: nondisclosure agreements with partners
  severity: medium
  refs: []
  source:
    document: Partner and Distributor Policy
    section: '4.1'
    quote: The nondisclosure agreement with a partner must require the partner not to disclose that the agreement
      was concluded or that the parties negotiated it, except as Keystone has agreed in writing.
  keywords:
  - existence of agreement
  - negotiations confidential
  - no announcement
- id: C-32
  title: No independent creation in high value partner NDAs
  requirement: The NDA with a high value partner must not contain wording that lets the partner independently create
    information resembling the information Keystone discloses.
  kind: forbid
  term: The NDA with a high value partner must not contain wording that lets the partner independently create information
    resembling the information Keystone discloses.
  applies_if: counterparty == 'partner' and value_band == 'high'
  applies_when: partner relationships in the high deal value band, such as joint development or long-term manufacturing
  severity: high
  approval: Chief Technology Officer
  refs: []
  source:
    document: Partner and Distributor Policy
    section: '4.3'
    quote: Where the relationship is in the high deal value band, typically a joint development or a long-term manufacturing
      arrangement, the nondisclosure agreement must not contain wording that lets the partner independently create
      information resembling what we disclose.
  keywords:
  - independent development
  - independently create
  - resembling information
- id: C-33
  title: Return or destroy supplier information after the agreement ends
  requirement: The Receiving Party must return or destroy the information provided to it once the agreement is over.
  kind: require
  term: The Receiving Party must return or destroy the information provided to it once the agreement is over.
  applies_if: counterparty == 'vendor'
  applies_when: nondisclosure agreements with a supplier
  severity: high
  refs: []
  source:
    document: Supplier Engagement Policy
    section: '3.1'
    quote: Every nondisclosure agreement with a supplier must oblige the supplier to give back or destroy the information
      we have provided once the agreement is over.
  keywords:
  - return or destroy
  - confidential information
  - end of agreement
- id: C-34
  title: Return or destruction deadline for supplier NDAs
  requirement: The NDA sets the deadline for the return or destruction of information provided by the company.
  kind: field
  term: The NDA sets the deadline for the return or destruction of information provided by the company.
  applies_if: counterparty == 'vendor'
  applies_when: nondisclosure agreements with a supplier
  severity: high
  constraint:
    field: return_deadline_days
    op: <=
    value: 30
  approval: Vice President, Supply Chain
  refs: []
  source:
    document: Supplier Engagement Policy
    section: '3.2'
    quote: The return or destruction has to be completed within 30 days of the end of the agreement or of our written
      request, whichever comes first.
  keywords:
  - return deadline
  - days after termination
  - written request
- id: C-35
  title: No archival or residual carve-outs on medium and high value supplier deals
  requirement: A carve-out from the return or destruction obligation for archival copies, residual knowledge or
    retained working files.
  kind: forbid
  term: A carve-out from the return or destruction obligation for archival copies, residual knowledge or retained
    working files.
  applies_if: counterparty == 'vendor' and value_band in ('medium', 'high')
  applies_when: supplier deals in the medium or high value band
  severity: high
  approval: Chief Technology Officer
  refs: []
  source:
    document: Supplier Engagement Policy
    section: '3.6'
    quote: The agreement may not carve out archival copies, residual knowledge or retained working files for these
      deals.
  keywords:
  - archival copies
  - residual knowledge
  - retained working files
- id: C-36
  title: No clause barring hiring of the other side's personnel
  requirement: A clause that bars either side from approaching or hiring the other side's personnel.
  kind: forbid
  term: A clause that bars either side from approaching or hiring the other side's personnel.
  applies_if: counterparty in ('vendor', 'customer') or governing_law == 'california'
  applies_when: nondisclosure agreements with a supplier or a customer, and any agreement governed by California
    law
  severity: medium
  refs: []
  source:
    document: Supplier Engagement Policy
    section: '3.4'
    quote: For that reason, a nondisclosure agreement with a supplier or a customer must not contain a clause that
      bars either side from approaching or hiring the other's personnel, and no agreement governed by California
      law, whoever the counterparty is, may contain that kind of employee-restricting clause.
  keywords:
  - non-solicitation
  - hiring employees
  - approach personnel
- id: C-37
  title: Verbal information protected
  requirement: The NDA must state that information communicated verbally counts as protected information just as
    written material does.
  kind: require
  term: The NDA must state that information communicated verbally counts as protected information just as written
    material does.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '3.1'
    quote: Our position is that knowledge conveyed aloud deserves the same protection as a drawing or a file, and
      any written nondisclosure agreement that Keystone signs must state that information communicated verbally
      counts as protected information just as written material does.
  keywords:
  - verbal information
  - oral disclosure
  - conversations protected
- id: C-38
  title: Use limited to stated purposes
  requirement: The NDA must restrict the recipient to using the information solely for the specific purposes described
    in the agreement, excluding its own product development, quoting to other customers and training of its own
    staff.
  kind: require
  term: The NDA must restrict the recipient to using the information solely for the specific purposes described
    in the agreement, excluding its own product development, quoting to other customers and training of its own
    staff.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '3.2'
    quote: Every nondisclosure agreement we sign must therefore restrict the recipient to using what it learns solely
      for the specific purposes described in that agreement, and for nothing else, including its own product development,
      quoting to other customers or training of its own staff.
  keywords:
  - purpose limitation
  - use restriction
  - no product development
- id: C-39
  title: No analysis or reverse engineering of samples
  requirement: The NDA must forbid the recipient from analyzing samples, prototypes, tooling or software in order
    to work out how they were made, including by disassembly, decompilation, chemical or metallurgical analysis
    and dimensional scanning.
  kind: require
  term: The NDA must forbid the recipient from analyzing samples, prototypes, tooling or software in order to work
    out how they were made, including by disassembly, decompilation, chemical or metallurgical analysis and dimensional
    scanning.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '3.4'
    quote: We require that any nondisclosure agreement forbid the recipient from analyzing our samples, prototypes,
      tooling or software in order to work out how they were made, including disassembly, decompilation, chemical
      or metallurgical analysis, and dimensional scanning intended to recreate them.
  keywords:
  - reverse engineering prohibition
  - no disassembly
  - decompilation ban
- id: C-40
  title: No transfer of rights in information
  requirement: The NDA must make clear that the other side acquires no license and no other right of any kind in
    the disclosing party's information, designs or processes by receiving them.
  kind: require
  term: The NDA must make clear that the other side acquires no license and no other right of any kind in the disclosing
    party's information, designs or processes by receiving them.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '4.1'
    quote: Each nondisclosure agreement we sign must make clear that the other side acquires no license and no other
      right of any kind in our information, designs or processes by virtue of receiving them.
  keywords:
  - no license granted
  - no rights transferred
  - ownership retained
- id: C-41
  title: Secrecy duties survive termination
  requirement: The NDA must state that the recipient's duties of secrecy and other continuing terms do not fall
    away when the agreement is terminated or expires, but remain in force afterward.
  kind: require
  term: The NDA must state that the recipient's duties of secrecy and other continuing terms do not fall away when
    the agreement is terminated or expires, but remain in force afterward.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '5.1'
    quote: For that reason each nondisclosure agreement must state that the recipient's duties of secrecy and the
      other terms that are meant to continue do not fall away when the agreement is terminated or expires, but remain
      in force afterward.
  keywords:
  - survival clause
  - duties continue after termination
  - secrecy survives expiry
- id: C-42
  title: Minimum secrecy period
  requirement: Secrecy period for the recipient's duties under the NDA.
  kind: field
  term: Secrecy period for the recipient's duties under the NDA.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 60
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '5.3'
    quote: Every nondisclosure agreement Keystone signs must therefore keep the recipient's secrecy duties running
      for a period of not less than 60 months.
  keywords:
  - secrecy period
  - confidentiality term
  - minimum duration
- id: C-43
  title: Minimum survival after termination
  requirement: Duration of the recipient's secrecy duties after the agreement ends early.
  kind: field
  term: Duration of the recipient's secrecy duties after the agreement ends early.
  applies_if: 'True'
  applies_when: the agreement ends before the secrecy period would otherwise run out
  severity: medium
  constraint:
    field: survival_months
    op: '>='
    value: 36
  refs: []
  source:
    document: Trade Secret Protection Policy
    section: '5.4'
    quote: Where the agreement ends before the secrecy period would otherwise run out, the recipient's duties must
      continue after termination for at least 36 months.
  keywords:
  - survival period
  - post-termination duties
  - continuing obligations
