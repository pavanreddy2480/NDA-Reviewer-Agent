  keywords:
  - secrecy period
  - confidentiality term
  - protection duration
- id: C-25
  title: Maximum survival after termination
  requirement: Duration of continuing duties after the NDA is terminated.
  kind: field
  term: Duration of continuing duties after the NDA is terminated.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  constraint:
    field: survival_months
    op: <=
    value: 84
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '5.2'
    quote: Duties that are expressed to continue after an agreement has been terminated must not extend past 84
      months from termination.
  keywords:
  - survival period
  - post-termination duties
  - continuing obligations
- id: C-26
  title: Governing law Ohio or Delaware
  requirement: Governing law of the NDA.
  kind: field
  term: Governing law of the NDA.
  applies_if: 'True'
  applies_when: ''
