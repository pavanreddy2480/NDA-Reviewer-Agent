  keywords:
  - governing law
  - choice of law
  - Ohio Delaware law
- id: C-27
  title: Preferred dispute forum
  requirement: Forum for disputes under the NDA.
  kind: field
  term: Forum for disputes under the NDA.
  applies_if: 'True'
  applies_when: ''
  severity: low
  constraint:
    field: dispute_forum
    op: in
    value:
    - ohio
