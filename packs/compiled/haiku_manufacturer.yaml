# Requirement cards for Keystone Precision Manufacturing, Inc., compiled by claude-haiku-agent from the prose policies
# (policy/compiler.py). 43 cards from 11 documents; 0 dropped for a quote not in the policy.
company: Keystone Precision Manufacturing, Inc.
description: ''
version: compiled-1
rules:
- id: C-01
  title: Permit sharing with the recipient's own staff
  requirement: The NDA must permit the receiving party to share Confidential Information with its own employees
    who need it for the purpose of the work.
  kind: require
  term: The NDA must permit the receiving party to share Confidential Information with its own employees who need
    it for the purpose of the work.
  applies_if: company_side in ['disclosing', 'mutual']
  applies_when: agreements under which Keystone shares its information with the other side
  severity: medium
  approval: Vice President, Human Resources, after consulting the General Counsel
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '3.1'
    quote: Whenever Keystone signs an agreement that governs how the other side treats our information, the agreement
      must permit the recipient to share some of that information with those of its own employees who need it for
      the purpose of the work.
  keywords:
  - permitted disclosure to employees
  - need to know
  - representatives
- id: C-02
  title: Non-solicitation by individual employees and contractor engineers
  requirement: The NDA with an individual employee or contractor engineer must commit the individual not to solicit
    the company's personnel to leave.
  kind: require
  term: The NDA with an individual employee or contractor engineer must commit the individual not to solicit the
    company's personnel to leave.
  applies_if: counterparty == 'employee' and governing_law != 'california'
  applies_when: agreements with an individual employee or contractor engineer where California law does not govern
  severity: medium
  approval: Vice President, Human Resources, after consulting the General Counsel
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '3.3'
    quote: For that reason, each agreement with an individual employee or contractor engineer must commit the individual
      not to solicit Keystone's personnel to leave.
  keywords:
  - non-solicitation of employees
  - no solicitation of staff
  - do not solicit personnel
- id: C-03
  title: No non-solicitation commitment under California law
  requirement: The NDA must not include a commitment by an individual governed by California law not to solicit
    the company's personnel to leave.
  kind: forbid
  term: The NDA must not include a commitment by an individual governed by California law not to solicit the company's
    personnel to leave.
  applies_if: counterparty == 'employee' and governing_law == 'california'
  applies_when: agreements with individual employees or contractor engineers governed by California law
  severity: medium
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '3.3'
    quote: Where California law governs the individual's agreement, no such commitment is included, because California
      law does not allow it.
  keywords:
  - non-solicitation
  - California
  - employee solicitation
- id: C-04
  title: Federal whistleblower immunity notice
  requirement: The NDA with an employee must include a notice that federal law protects disclosure of a trade secret
    in confidence to a government official or a lawyer solely to report or investigate a suspected violation of
    law, and disclosure made under seal in a court filing.
  kind: require
  term: The NDA with an employee must include a notice that federal law protects disclosure of a trade secret in
    confidence to a government official or a lawyer solely to report or investigate a suspected violation of law,
    and disclosure made under seal in a court filing.
  applies_if: counterparty == 'employee' and us_law
  applies_when: agreements with employees governed by United States law
  severity: high
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '4.2'
    quote: Keystone therefore requires that each agreement with an employee that is governed by United States law,
      whether federal or state, include a notice of this immunity.
  keywords:
  - whistleblower immunity notice
  - trade secret disclosure to government
  - immunity from liability
- id: C-05
  title: No restriction on reporting to government agencies
  requirement: The NDA must not prevent an employee from filing a complaint with, communicating with or providing
    information to a government agency without notice to the company.
  kind: forbid
  term: The NDA must not prevent an employee from filing a complaint with, communicating with or providing information
    to a government agency without notice to the company.
  applies_if: counterparty == 'employee'
  applies_when: agreements with employees
  severity: high
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '4.3'
    quote: Nothing in this policy or in any agreement with Keystone prevents an employee from filing a complaint
      with, communicating with or providing information to a government agency such as the National Labor Relations
      Board, the Equal Employment Opportunity Commission, the Occupational Safety and Health Administration or the
      Securities and Exchange Commission, without notice to Keystone.
  keywords:
  - government agency reporting
  - whistleblower carve-out
  - regulator communication
- id: C-06
  title: No restriction on discussing wages and working conditions
  requirement: The NDA must not limit an employee's right to discuss wages, hours and working conditions with co-workers
    or others.
  kind: forbid
  term: The NDA must not limit an employee's right to discuss wages, hours and working conditions with co-workers
    or others.
  applies_if: counterparty == 'employee'
  applies_when: agreements with employees
  severity: high
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '4.3'
    quote: Nor does it limit the right of employees to discuss wages, hours and working conditions with each other
      or with others, as protected by Section 7 of the National Labor Relations Act.
  keywords:
  - discuss wages
  - working conditions
  - concerted activity
- id: C-07
  title: Employee confidentiality survives departure
  requirement: The NDA with an employee must state that the employee's confidentiality duties continue after employment
    ends, for as long as the information remains confidential.
  kind: require
  term: The NDA with an employee must state that the employee's confidentiality duties continue after employment
    ends, for as long as the information remains confidential.
  applies_if: counterparty == 'employee'
  applies_when: agreements with employees
  severity: medium
  approval: Vice President, Human Resources, after consulting the General Counsel
  refs: []
  source:
    document: Employee Confidentiality Policy
    section: '3.4'
    quote: Employees' duties to protect confidential information continue after they leave, for as long as the information
      remains confidential.
  keywords:
  - survival after employment
  - post-employment confidentiality
  - continues after termination
- id: C-08
  title: Recipient may make working copies
  requirement: The agreement must allow the recipient to make copies of portions of the information where needed
    for the task, subject to the other protections in the agreement.
  kind: require
  term: The agreement must allow the recipient to make copies of portions of the information where needed for the
    task, subject to the other protections in the agreement.
  applies_if: company_side in ['disclosing', 'mutual']
  applies_when: agreements under which Keystone supplies information to an outside party
  severity: medium
  approval: Vice President, Engineering; Chief Technology Officer for Tier 1 data
  refs: []
  source:
    document: Engineering Data Handling Policy
    section: '3.2'
    quote: Any agreement under which we supply information to an outside party must therefore allow the recipient
      to make copies of portions of what we provide where that is needed for the task, subject to the other protections
      in the agreement.
  keywords:
  - working copies
  - archive copy
  - permitted copies
- id: C-09
  title: Protection regardless of legend
  requirement: The agreement must protect Keystone's information whether or not it carries a legend, and must not
    make protection depend on whether each item was marked or identified as secret.
  kind: require
  term: The agreement must protect Keystone's information whether or not it carries a legend, and must not make
    protection depend on whether each item was marked or identified as secret.
  applies_if: company_side in ['disclosing', 'mutual']
  applies_when: agreements where Keystone is the disclosing side
  severity: high
  approval: Vice President, Engineering; Chief Technology Officer for Tier 1 data
  refs: []
  source:
    document: Engineering Data Handling Policy
    section: '3.5'
    quote: Where Keystone is the disclosing side, the agreement we sign must protect our information whether or
      not it carries a legend, and must not make protection depend on whether each item was marked or identified
      as secret.
  keywords:
  - legend
  - marking not required
  - identified as secret
- id: C-10
  title: Minimum return or destruction period
  requirement: The time allowed to the recipient for returning or destroying Keystone's materials must be at least
    the required minimum number of days.
  kind: field
  term: The time allowed to the recipient for returning or destroying Keystone's materials must be at least the
    required minimum number of days.
  applies_if: company_side in ['disclosing', 'mutual']
  applies_when: agreements where Keystone discloses engineering data to an outside party
  severity: medium
  constraint:
    field: return_deadline_days
    op: '>='
    value: 10
  approval: Vice President, Engineering; Chief Technology Officer for Tier 1 data
  refs: []
  source:
    document: Engineering Data Handling Policy
    section: '4.2'
    quote: The time allowed to the other side for returning or destroying our materials must be at least 10 days,
      so that the recipient can find and process all of it.
  keywords:
  - return period
  - destruction deadline
  - return or destroy
- id: C-11
  title: Recipient use and safeguards for personal data
  requirement: The agreement must require the recipient to use the personal data solely for the purpose stated and
    to protect it with appropriate security safeguards.
  kind: require
  term: The agreement must require the recipient to use the personal data solely for the purpose stated and to protect
    it with appropriate security safeguards.
  applies_if: personal_data
  applies_when: personal data is to be exchanged with an outside party
  severity: high
  refs: []
  source:
    document: Engineering Data Handling Policy
    section: '5.1'
    quote: When personal data is to be exchanged with an outside party, the agreement must require the recipient
      to use the personal data solely for the purpose stated and to protect it with appropriate security safeguards.
  keywords:
  - purpose limitation
  - security safeguards
  - use solely for purpose
- id: C-12
  title: Minimum confidentiality period for personal data
  requirement: When personal data is shared, the period during which the recipient must keep information secret
    must be at least the required minimum term.
  kind: field
  term: When personal data is shared, the period during which the recipient must keep information secret must be
    at least the required minimum term.
  applies_if: personal_data
  applies_when: personal data is going to be shared
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 84
  approval: Vice President, Engineering; Chief Technology Officer for Tier 1 data
  refs: []
  source:
    document: Engineering Data Handling Policy
    section: '5.2'
    quote: If personal data is going to be shared, the period during which the recipient must keep information secret
      must run for at least 84 months.
  keywords:
  - confidentiality period
  - secrecy term
  - personal data duration
- id: C-13
  title: Export control undertaking
  requirement: The agreement must contain the recipient's undertaking to comply with applicable export control laws
    and not to export or re-export Keystone technical data without the required authorization.
  kind: require
  term: The agreement must contain the recipient's undertaking to comply with applicable export control laws and
    not to export or re-export Keystone technical data without the required authorization.
  applies_if: foreign or not us_law
  applies_when: the recipient is located outside the United States, or the agreement is not governed by a US state's
    law
  severity: high
  refs: []
  source:
    document: Engineering Data Handling Policy
    section: '5.4'
    quote: When the recipient of our information is located outside the United States, or when the governing law
      of the agreement is not that of a US state, the agreement must contain an undertaking by the recipient to
      comply with applicable export control laws and not to export or re-export our technical data without the required
      authorization.
  keywords:
  - export control undertaking
  - re-export restriction
  - comply with export laws
- id: C-14
  title: Recipient may use outside advisers
  requirement: The NDA must allow the recipient to pass the information to its outside advisers, consultants and
    agents, provided they are bound to keep it secret.
  kind: require
  term: The NDA must allow the recipient to pass the information to its outside advisers, consultants and agents,
    provided they are bound to keep it secret.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '3.1'
    quote: An agreement that governs the exchange of our information must allow the recipient to pass what it receives
      to its outside advisers, consultants and agents, provided they are bound to keep it secret.
  keywords:
  - outside advisers sharing
  - consultants agents disclosure
  - representatives permitted
- id: C-15
  title: No ban on consulting outside persons
  requirement: The NDA forbids the recipient from consulting any outside person about the information.
  kind: forbid
  term: The NDA forbids the recipient from consulting any outside person about the information.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '3.1'
    quote: Wording that forbids the recipient from consulting any outside person at all is not acceptable.
  keywords:
  - no outside consultation
  - advisers prohibited
  - representatives barred
- id: C-16
  title: Free to obtain similar information elsewhere
  requirement: The NDA must confirm that the recipient remains free to obtain information resembling the disclosing
    party's from a third party.
  kind: require
  term: The NDA must confirm that the recipient remains free to obtain information resembling the disclosing party's
    from a third party.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '3.3'
    quote: Each agreement should therefore confirm that the recipient remains free to obtain information resembling
      ours from a third party.
  keywords:
  - independent third party information
  - similar information obtained
  - no restriction on third-party sources
- id: C-17
  title: Independent receipt not a breach
  requirement: The NDA treats the recipient's independent receipt of similar information from a third party as a
    breach.
  kind: forbid
  term: The NDA treats the recipient's independent receipt of similar information from a third party as a breach.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '3.3'
    quote: We will not sign a document that treats such an event as a violation.
  keywords:
  - similar information breach
  - third party source breach
  - independent receipt violation
- id: C-18
  title: Amendments in writing and signed
  requirement: The NDA must provide that amendments must be in writing and signed by authorized signatories of both
    parties.
  kind: require
  term: The NDA must provide that amendments must be in writing and signed by authorized signatories of both parties.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '3.5'
    quote: Amendments must be in writing, signed by authorized signatories of both parties, and routed through the
      same review and approval path as the original document.
  keywords:
  - written amendments
  - signed amendments
  - entire agreement amendment
- id: C-19
  title: Correct party names and addresses
  requirement: The NDA must state each party's correct legal name and address.
  kind: require
  term: The NDA must state each party's correct legal name and address.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '3.6'
    quote: Reviewers verify, at a minimum, that each document states the parties' correct legal names and addresses,
      the scope of work, prices and payment terms, delivery or performance dates, warranties, limits on liability,
      insurance, indemnities, termination rights, notices, assignment and subcontracting.
  keywords:
  - party legal names
  - parties addresses
  - notice addresses
- id: C-20
  title: No penalty on breach of secrecy
  requirement: The NDA fixes a penalty or liquidated damages amount payable when a party breaches its duty of secrecy.
  kind: forbid
  term: The NDA fixes a penalty or liquidated damages amount payable when a party breaches its duty of secrecy.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '4.2'
    quote: Keystone does not sign an agreement that fixes a penalty or liquidated damages amount to be paid when
      a party breaches its duty of secrecy, and it does not ask the other side to accept one.
  keywords:
  - liquidated damages
  - penalty for breach
  - fixed damages amount
- id: C-21
  title: No license to patents or Tier 1 material
  requirement: The NDA grants the other side a license to the disclosing party's patents or Tier 1 material.
  kind: forbid
  term: The NDA grants the other side a license to the disclosing party's patents or Tier 1 material.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: Chief Technology Officer
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '4.3'
    quote: Licenses to Keystone's patents or Tier 1 material may be granted only with the approval of the Chief
      Technology Officer, on advice from the General Counsel.
  keywords:
  - patent license grant
  - trade secret license
  - license to Tier 1
- id: C-22
  title: No non-compete on Keystone
  requirement: The NDA contains a commitment by the company not to compete, not to sell to specified customers or
    not to buy from other suppliers.
  kind: forbid
  term: The NDA contains a commitment by the company not to compete, not to sell to specified customers or not to
    buy from other suppliers.
  applies_if: 'True'
  applies_when: ''
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '4.4'
    quote: Any commitment by Keystone not to compete, not to sell to specified customers or not to buy from other
      suppliers requires General Counsel approval.
  keywords:
  - non-compete clause
  - no-sell commitment
  - exclusive supplier obligation
- id: C-23
  title: Limits on automatic renewal
  requirement: The NDA renews automatically for a period longer than the standard renewal period, or requires long
    advance notice to prevent renewal.
  kind: forbid
  term: The NDA renews automatically for a period longer than the standard renewal period, or requires long advance
    notice to prevent renewal.
  applies_if: 'True'
  applies_when: applies when the NDA renews automatically
  severity: medium
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '4.7'
    quote: A document that renews automatically for a period longer than twelve months, or that requires more than
      ninety days' notice to prevent renewal, requires approval by the General Counsel.
  keywords:
  - automatic renewal term
  - notice to prevent renewal
  - evergreen clause
- id: C-24
  title: Maximum secrecy period
  requirement: Period during which the recipient must keep the disclosing party's information secret.
  kind: field
  term: Period during which the recipient must keep the disclosing party's information secret.
  applies_if: 'True'
  applies_when: ''
  severity: high
  constraint:
    field: confidentiality_term_months
    op: <=
    value: 120
  approval: General Counsel
  refs: []
  source:
    document: Legal Review and Approval Policy
    section: '5.1'
    quote: The period during which a recipient must keep our information secret, and during which we must keep theirs
