# GOLD rule list for Northwind Cloud, Inc., generated by claude-sonnet (agent) (packgen.py) and reviewed by people.
# Keep away from the reviewer builders: used only to score the policy compiler (design D17).
company: Northwind Cloud, Inc.
description: Delaware-incorporated B2B SaaS company in New York. Vendor-heavy; customer personal data is common;
  sells to enterprises and some EU customers.
version: '1'
rules:
- id: P-01
  title: Use limited to the stated purpose
  requirement: The receiving party may use our information only for the purposes the agreement states.
  kind: require
  term: Receiving Party shall not use any Confidential Information for any purpose other than the purposes stated
    in the Agreement.
  severity: high
  anchor:
    hypothesis: nda-4
  source:
    document: Confidentiality and NDA Standard
    section: '4.1'
    quote: Every agreement we sign or propose must limit the receiving party's use of our information to the purposes
      the agreement itself states, and no other purpose.
  keywords:
  - purpose
  - use
  - permitted use
- id: P-02
  title: Spoken disclosures are covered
  requirement: Information we share in meetings, calls or demonstrations must be protected even if it is only spoken.
  kind: require
  term: Confidential Information may include verbally conveyed information.
  anchor:
    hypothesis: nda-3
  source:
    document: Confidentiality and NDA Standard
    section: '4.2'
    quote: Information that we share in meetings, calls or demonstrations must be covered even though it is spoken
      and never written down.
  keywords:
  - oral
  - orally
  - verbal
  - demonstration
- id: P-03
  title: Obligations survive the end of the agreement
  requirement: The duties of confidence must continue to bind the parties after the agreement ends or expires.
  kind: require
  term: Some obligations of the Agreement survive termination or expiry of the Agreement.
  severity: high
  anchor:
    hypothesis: nda-19
  refs:
  - P-30
  source:
    document: Confidentiality and NDA Standard
    section: '4.3'
    quote: The agreement must make clear that the duties of confidence continue to bind the parties after the agreement
      has ended or expired.
  keywords:
  - survive
  - survival
  - termination
  - expiry
- id: P-04
  title: Notice before compelled disclosure
  requirement: If the other side is compelled by law or legal process to disclose our information, it must tell
    us first.
  kind: require
  term: Receiving Party shall notify Disclosing Party if Receiving Party is required by law, regulation or judicial
    process to disclose any Confidential Information.
  anchor:
    hypothesis: nda-8
  source:
    document: Confidentiality and NDA Standard
    section: '4.4'
    quote: If the other side is compelled by law, regulation or a court or agency process to disclose our information,
      it must tell us before it does so.
  keywords:
  - required by law
  - subpoena
  - court order
  - compelled
  - notify
- id: P-05
  title: No licence or rights granted
  requirement: The agreement must not give the other side any licence, ownership interest or other right in our
    information.
  kind: require
  term: The Agreement does not grant the Receiving Party any right or licence to Confidential Information.
  anchor:
    hypothesis: nda-15
  refs:
  - P-25
  source:
    document: Confidentiality and NDA Standard
    section: '4.5'
    quote: No clause may be read as handing the other side a licence, ownership interest or any other right in the
      information we disclose.
  keywords:
  - license
  - licence
  - right
  - title
  - ownership
- id: P-06
  title: Definition not limited to technical information
  requirement: In customer and partner agreements the definition of protected information must cover business, financial
    and commercial information, not technical material alone.
  kind: forbid
  term: Confidential Information shall only include technical information.
  applies_if: counterparty in ['customer', 'partner']
  anchor:
    hypothesis: nda-2
  source:
    document: Confidentiality and NDA Standard
    section: '5.1'
    quote: In agreements with customers and partners, the definition of protected information must reach business,
      financial and commercial information and may not be confined to technical material alone.
  keywords:
  - technical
  - business
  - financial
  - definition
- id: P-07
  title: No non-solicitation in customer agreements
  requirement: Customer agreements must not stop either side from approaching or hiring the other side's people.
  kind: forbid
  term: Receiving Party shall not solicit some of Disclosing Party's representatives or employees.
  applies_if: counterparty == 'customer'
  anchor:
    hypothesis: nda-18
  refs:
  - P-23
  source:
    document: Confidentiality and NDA Standard
    section: '5.2'
    quote: An agreement with a customer must not bar either side from approaching or hiring the other side's people.
  keywords:
  - solicit
  - hire
  - employ
  - recruit
- id: P-08
  title: The deal itself is kept secret
  requirement: The other side must agree not to reveal that the parties negotiated or entered into the agreement.
  kind: require
  term: Receiving Party shall not disclose the fact that the Agreement was agreed or negotiated.
  severity: low
  anchor:
    hypothesis: nda-10
  source:
    document: Confidentiality and NDA Standard
    section: '5.3'
    quote: The other side must agree not to reveal that the parties have negotiated or entered into the agreement.
  keywords:
  - existence
  - fact of agreement
  - negotiations
  - discussions
- id: P-09
  title: No residuals clause
  requirement: We never accept a clause letting the other side keep using whatever it remembers from our information.
  kind: forbid
  term: The Receiving Party may freely use residual knowledge, ideas or know-how retained in unaided memory from
    Confidential Information.
  severity: high
  source:
    document: Confidentiality and NDA Standard
    section: '5.4'
    quote: We never accept a clause that lets the other side keep using whatever it happens to remember from our
      information, often called a residuals clause.
  keywords:
  - residuals
  - unaided memory
  - retained in memory
  - know-how
- id: P-10
  title: Minimum confidentiality term
  requirement: The duty of confidence must last at least 24 months; a shorter period needs Deputy General Counsel
    approval.
  kind: field
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 24
  approval: Deputy General Counsel
  refs:
  - P-11
  source:
    document: Confidentiality and NDA Standard
    section: '6.1'
    quote: The duty of confidence must run for at least 24 months.
- id: P-11
  title: Maximum confidentiality term
  requirement: The duty of confidence may not be stated to run for more than 60 months.
  kind: field
  constraint:
    field: confidentiality_term_months
    op: <=
    value: 60
  refs:
  - P-10
  source:
    document: Confidentiality and NDA Standard
    section: '6.2'
    quote: The duty of confidence may not be stated to run for more than 60 months.
- id: P-12
  title: Minimum survival period
  requirement: Obligations that survive the end of the agreement must survive for at least 24 months.
  kind: field
  constraint:
    field: survival_months
    op: '>='
    value: 24
  refs:
  - P-30
  source:
    document: Confidentiality and NDA Standard
    section: '6.3'
    quote: Obligations that survive the end of the agreement must survive for at least 24 months.
- id: P-13
  title: Return or destruction on exit
  requirement: Vendors and partners must be obliged to return or destroy our information when the relationship ends.
  kind: require
  term: Receiving Party shall destroy or return some Confidential Information upon the termination of the Agreement.
  applies_if: counterparty in ['vendor', 'partner']
  severity: high
  anchor:
    hypothesis: nda-16
  refs:
  - P-14
  source:
    document: Vendor and Third-Party Risk Policy
    section: '3.1'
    quote: Vendors and partners must be required to return or destroy our information when the relationship ends.
  keywords:
  - return
  - destroy
  - destruction
  - termination
- id: P-14
  title: Return deadline
  requirement: Return or destruction must be completed within 30 days.
  kind: field
  constraint:
    field: return_deadline_days
    op: <=
    value: 30
  refs:
  - P-13
  source:
    document: Vendor and Third-Party Risk Policy
    section: '3.2'
    quote: Return or destruction must be completed within 30 days of the end of the relationship or of our written
      request, whichever comes first.
- id: P-15
  title: No retention by vendors handling personal data
  requirement: A vendor handling personal data may not keep any of our information after returning or destroying
    it, unless the Chief Information Security Officer approves.
  kind: forbid
  term: Receiving Party may retain some Confidential Information even after the return or destruction of Confidential
    Information.
  applies_if: counterparty == 'vendor' and personal_data
  severity: high
  anchor:
    hypothesis: nda-20
  approval: Chief Information Security Officer
  refs:
  - P-14
  source:
    document: Vendor and Third-Party Risk Policy
    section: '3.3'
    quote: A vendor that handles personal data must not be allowed to keep any of our information once it has returned
      or destroyed it, whether in archives, backups or working files, unless the Chief Information Security Officer
      approves in writing.
  keywords:
  - retain
  - retention
  - archival copy
  - backup
- id: P-16
  title: No reverse engineering by vendors
  requirement: Vendor agreements must prohibit reverse engineering of anything that embodies our information.
  kind: require
  term: Receiving Party shall not reverse engineer any objects which embody Disclosing Party's Confidential Information.
  applies_if: counterparty == 'vendor'
  anchor:
    hypothesis: nda-11
  source:
    document: Vendor and Third-Party Risk Policy
    section: '3.4'
    quote: Vendor agreements must prohibit the vendor from reverse engineering, decompiling or disassembling any
      software, hardware or material that embodies our information.
  keywords:
  - reverse engineer
  - decompile
  - disassemble
- id: P-17
  title: Sharing with advisers and subcontractors
  requirement: We must be allowed to share information we receive with our advisers, auditors and subcontractors
    who need it.
  kind: require
  term: Receiving Party may share some Confidential Information with some third-parties, including consultants,
    agents and professional advisors.
  anchor:
    hypothesis: nda-7
  source:
    document: Vendor and Third-Party Risk Policy
    section: '4.1'
    quote: We must be allowed to share information we receive with our professional advisers, auditors, contractors
      and subcontractors who need it for the engagement.
  keywords:
  - advisors
  - consultants
  - subcontractors
  - auditors
  - third parties
- id: P-18
  title: Sharing with our employees
  requirement: Our employees who need the information for their work must be permitted to see it.
  kind: require
  term: Receiving Party may share some Confidential Information with some of Receiving Party's employees.
  anchor:
    hypothesis: nda-5
  source:
    document: Vendor and Third-Party Risk Policy
    section: '4.2'
    quote: Our employees who need the information to do their jobs must be permitted to see it.
  keywords:
  - employees
  - need to know
  - personnel
- id: P-19
  title: No marking requirement where personal data is exchanged
  requirement: Where personal data is exchanged, protection must not depend on the information being marked or labelled
    confidential.
  kind: forbid
  term: All Confidential Information shall be expressly identified by the Disclosing Party.
  applies_if: personal_data
  severity: high
  anchor:
    hypothesis: nda-1
  refs:
  - P-15
  source:
    document: Data Protection and Privacy Policy
    section: '3.1'
    quote: Where personal data will be exchanged, protection may not depend on the disclosing party marking or labelling
      the information as confidential.
  keywords:
  - marked
  - labelled
  - identified
  - designated
- id: P-20
  title: Transfer mechanism for cross-border personal data
  requirement: Personal data transferred to or from a counterparty outside the United States needs the EU Standard
    Contractual Clauses or an equivalent mechanism approved by the Privacy Office.
  kind: require
  term: The Agreement incorporates the EU Standard Contractual Clauses or an approved equivalent mechanism for cross-border
    transfers of personal data.
  applies_if: personal_data and foreign
  severity: high
  source:
    document: Data Protection and Privacy Policy
    section: '4.1'
    quote: When personal data is transferred to or from a counterparty outside the United States, the agreement
      must incorporate the EU Standard Contractual Clauses or an equivalent transfer mechanism approved by the Privacy
      Office.
  keywords:
  - standard contractual clauses
  - SCC
  - cross-border
  - transfer
  - GDPR
- id: P-21
  title: Longer confidentiality term for personal data
  requirement: When personal data is involved, the duty of confidence must last at least 36 months.
  kind: field
  applies_if: personal_data
  severity: high
  constraint:
    field: confidentiality_term_months
    op: '>='
    value: 36
  refs:
  - P-10
  source:
    document: Data Protection and Privacy Policy
    section: '5.1'
    quote: When personal data is involved, the duty of confidence must last at least 36 months.
- id: P-22
  title: Governing law
  requirement: Agreements must be governed by Delaware or New York law unless the General Counsel approves otherwise.
  kind: field
  severity: high
  constraint:
    field: governing_law
    op: in
    value:
    - delaware
    - new york
  approval: General Counsel
  source:
    document: Contract Approval Matrix
    section: '3.1'
    quote: Agreements must be governed by the law of Delaware or New York, and any other governing law requires
      prior written approval from the General Counsel.
- id: P-23
  title: Partner non-solicitation limit
  requirement: In partner agreements any restriction on soliciting the other side's staff may last at most 12 months;
    longer needs Chief Revenue Officer approval.
  kind: field
  applies_if: counterparty == 'partner'
  constraint:
    field: non_solicit_months
    op: <=
    value: 12
  approval: Chief Revenue Officer
  refs:
  - P-07
  source:
    document: Contract Approval Matrix
    section: '4.1'
    quote: In partner agreements, any restriction on soliciting the other side's staff may last no longer than 12
      months, and a longer restriction requires approval from the Chief Revenue Officer.
- id: P-24
  title: No non-compete under California law
  requirement: Where California law governs, the agreement must not restrict the other party from competing or practising
    its trade.
  kind: forbid
  term: The Agreement restricts the Receiving Party from competing with the Disclosing Party or from engaging in
    a lawful profession, trade or business.
  applies_if: governing_law == 'california'
  severity: high
  source:
    document: Contract Approval Matrix
    section: '4.2'
    quote: Where California law governs, the agreement must not contain any clause that restricts the other party
      from competing or from working in its profession or trade.
  keywords:
  - non-compete
  - noncompete
  - restraint of trade
  - compete
- id: P-25
  title: No transfer of ownership
  requirement: No clause may transfer ownership of our information, or of anything derived from it, to the other
    side.
  kind: forbid
  term: The Agreement assigns or transfers ownership of the Disclosing Party's Confidential Information or derivative
    works to the Receiving Party.
  severity: high
  refs:
  - P-05
  source:
    document: Intellectual Property Policy
    section: '2.1'
    quote: No clause may transfer ownership of our information, or of anything derived from it, to the other side.
  keywords:
  - assign
  - assignment
  - ownership
  - derivative works
  - feedback
- id: P-26
  title: No independent-development carve-out on high-value deals
  requirement: For high-value deals we do not accept language that lets the other side independently develop information
    similar to ours.
  kind: forbid
  term: Receiving Party may independently develop information similar to Confidential Information.
  applies_if: value_band == 'high'
  severity: high
  anchor:
    hypothesis: nda-12
  refs:
  - P-05
  source:
    document: Intellectual Property Policy
    section: '2.2'
    quote: For deals in the high value band, we do not accept language that lets the other side independently develop
      information similar to ours.
  keywords:
  - independent development
  - independently developed
  - similar information
- id: P-27
  title: Lawful acquisition from third parties preserved
  requirement: The agreement must preserve the right of the receiving party to obtain similar information lawfully
    from an independent third party.
  kind: require
  term: Receiving Party may acquire information similar to Confidential Information from a third party.
  anchor:
    hypothesis: nda-13
  source:
    document: Intellectual Property Policy
    section: '2.3'
    quote: The agreement must preserve the right of the receiving party to obtain similar information lawfully from
      an independent third party.
  keywords:
  - third party
  - lawfully obtained
  - similar information
  - publicly available
- id: P-28
  title: Federal trade secret immunity notice for employees
  requirement: Employee agreements governed by United States law must include the notice of immunity for disclosures
    to government officials and attorneys.
  kind: require
  term: The Agreement includes the notice of immunity under the Defend Trade Secrets Act for disclosures of trade
    secrets to government officials or attorneys.
  applies_if: us_law and counterparty == 'employee'
  source:
    document: Intellectual Property Policy
    section: '3.1'
    quote: Agreements with employees governed by United States law must include the notice of immunity for confidential
      disclosure to government officials and attorneys that federal trade secret law requires.
  keywords:
  - whistleblower
  - immunity notice
  - Defend Trade Secrets Act
  - DTSA
- id: P-29
  title: Backup and record copies permitted
  requirement: We must be allowed to copy information we receive to the extent needed for backup, disaster recovery
    and legally required records.
  kind: require
  term: Receiving Party may create a copy of some Confidential Information in some circumstances.
  anchor:
    hypothesis: nda-17
  source:
    document: Records Retention and Disposal Policy
    section: '3.1'
    quote: We must be allowed to make copies of information we receive to the extent needed for backup, disaster
      recovery and legally required records.
  keywords:
  - copy
  - copies
  - backup
  - archival
  - disaster recovery
- id: P-30
  title: Maximum survival period
  requirement: Surviving obligations may not be stated to last more than 84 months.
  kind: field
  constraint:
    field: survival_months
    op: <=
    value: 84
  refs:
  - P-12
  source:
    document: Records Retention and Disposal Policy
    section: '3.2'
    quote: Obligations that survive the end of the agreement must not be stated to survive for more than 84 months.
